<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldWander - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <span class="logo">&#9992; WorldWander</span>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="europe.html">Europe</a></li>
      <li><a href="asia.html">Asia</a></li>
      <li><a href="register.html">Sign Up</a></li>
    </ul>
  </div>

  <div class="content">
    <h1>Sign Up for a Tour</h1>

    <div class="signup-box" id="signupBox">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName">

      <label for="passport">Passport Number</label>
      <input type="text" id="passport">

      <label for="country">Destination</label>
      <select id="country">
        <option value="1400">Paris, France ($1,400)</option>
        <option value="1200">Rome, Italy ($1,200)</option>
        <option value="2100">Swiss Alps, Switzerland ($2,100)</option>
        <option value="1600">Tokyo, Japan ($1,600)</option>
        <option value="900">Bangkok &amp; Phuket, Thailand ($900)</option>
        <option value="1000">Dubai, UAE ($1,000)</option>
      </select>

      <label for="travellers">Travellers</label>
      <input type="number" id="travellers" min="1" value="1">

      <p class="total">Total Price: $<span id="totalPrice">1400</span></p>

      <button id="signupButton">Confirm Booking</button>
      <p id="error"></p>
    </div>

    <div class="ticket" id="ticket">
      <h2>&#9992; Booking Confirmed</h2>
      <p>Booking ID: <strong id="bookingId"></strong></p>
      <p>Name: <strong id="ticketName"></strong></p>
      <p>Destination: <strong id="ticketCountry"></strong></p>
      <p>Total Paid: <strong id="ticketTotal"></strong></p>
      <a href="index.html">Back to Home</a>
    </div>
  </div>

  <div class="bottom">
    <p>WorldWander &middot; See the world, one trip at a time.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
